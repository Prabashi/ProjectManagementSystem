services:

  db:
    image: postgres:17
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:       projectmgmt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout:  5s
      retries:  10

  migrate:
    image: flyway/flyway:11
    command: migrate
    environment:
      FLYWAY_URL:      jdbc:postgresql://db:5432/projectmgmt
      FLYWAY_USER:     postgres
      FLYWAY_PASSWORD: postgres
    volumes:
      - ./backend/sql:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
