name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p frontend/e2e/reports

      - name: Run E2E tests
        run: docker compose -f docker-compose.fullstack.yml run --rm e2e

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: frontend/e2e/reports/report.html
          retention-days: 14

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.fullstack.yml down -v
